name: Build, Test and publish Containers

on:
  pull_request:
    paths:
      - "**/Dockerfile"
      - "**/versions.txt"
      - "pymol/**"
      - "tests/**"
  push:
    branches: [main]
    paths:
      - "**/Dockerfile"
      - "**/versions.txt"
      - "pymol/**"
      - "tests/**"
  workflow_dispatch:
    inputs:
      tool:
        description: "Tool to build (or 'all')"
        required: false
        default: "all"

# Ensure only one build runs at a time per branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # ── Determine which tool/version pairs need building ─────────
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
      has_changes: ${{ steps.changes.outputs.has_changes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed tools and versions
        id: changes
        run: |
          set -euo pipefail

          # ── Determine diff base ────────────────────────────────
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            BASE="${{ github.event.before }}"
          else
            BASE=""
          fi

          DISPATCH_TOOL="${{ github.event.inputs.tool || 'all' }}"

          # ── Helper: list all known tools ───────────────────────
          all_tools() {
            find . -mindepth 2 -maxdepth 2 -name Dockerfile \
              -not -path './.github/*' \
              -printf '%P\n' | sed 's|/Dockerfile$||' | sort -u
          }

          # ── Helper: list all tool/version pairs ────────────────
          all_pairs() {
            local tools
            if [[ "$DISPATCH_TOOL" != "all" && -n "$DISPATCH_TOOL" ]]; then
              tools="$DISPATCH_TOOL"
            else
              tools=$(all_tools)
            fi
            for t in $tools; do
              if [[ -f "${t}/versions.txt" ]]; then
                while IFS= read -r v || [[ -n "$v" ]]; do
                  [[ -z "$v" || "$v" =~ ^# ]] && continue
                  echo "${t}/${v}"
                done < "${t}/versions.txt"
              fi
            done | sort -u
          }

          # ── Helper: latest version for a tool from versions.txt ─
          latest_version() {
            local tool="$1"
            if [[ -f "${tool}/versions.txt" ]]; then
              grep -v '^[[:space:]]*#' "${tool}/versions.txt" | grep -v '^[[:space:]]*$' | sort -V | tail -1 || true
            fi
          }

          # ── Collect pairs to build ─────────────────────────────
          NULL_SHA="0000000000000000000000000000000000000000"
          if [[ -z "$BASE" || "$BASE" == "$NULL_SHA" ]]; then
            PAIRS=$(all_pairs)
            PUSHABLE_PAIRS="$PAIRS"
          else
            CHANGED=$(git diff --name-only "$BASE" HEAD)
            PAIRS=""
            PUSHABLE_PAIRS=""

            # Check every tool
            for tool in $(all_tools); do
              # 1. Did <tool>/Dockerfile or any build context asset in <tool>/ change? (excluding versions.txt)
              if [ -n "$(echo "$CHANGED" | grep -E "^${tool}/" | grep -vE "^${tool}/versions\.txt$" || true)" ]; then
                if [[ -f "${tool}/versions.txt" ]]; then
                  while IFS= read -r v || [[ -n "$v" ]]; do
                    [[ -z "$v" || "$v" =~ ^# ]] && continue
                    PAIRS=$(printf '%s\n%s/%s' "$PAIRS" "$tool" "$v")
                    PUSHABLE_PAIRS=$(printf '%s\n%s/%s' "$PUSHABLE_PAIRS" "$tool" "$v")
                  done < "${tool}/versions.txt"
                fi
              # 2. Did <tool>/versions.txt change?
              elif echo "$CHANGED" | grep -qx "${tool}/versions.txt"; then
                ADDED_VERSIONS=$(git diff "$BASE" HEAD -- "${tool}/versions.txt" | \
                  grep '^\+[^+]' | sed 's/^\+//' | tr -d '\r' | grep -v '^[[:space:]]*#' | grep -v '^[[:space:]]*$' || true)
                for v in $ADDED_VERSIONS; do
                  PAIRS=$(printf '%s\n%s/%s' "$PAIRS" "$tool" "$v")
                  PUSHABLE_PAIRS=$(printf '%s\n%s/%s' "$PUSHABLE_PAIRS" "$tool" "$v")
                done
              fi

              # 3. Did tests/<tool>/test.sh change? (test all versions, no push)
              if echo "$CHANGED" | grep -qE "^tests/${tool}/"; then
                if [[ -f "${tool}/versions.txt" ]]; then
                  while IFS= read -r v || [[ -n "$v" ]]; do
                    [[ -z "$v" || "$v" =~ ^# ]] && continue
                    PAIRS=$(printf '%s\n%s/%s' "$PAIRS" "$tool" "$v")
                  done < "${tool}/versions.txt"
                fi
              fi
            done

            # Deduplicate and drop blank lines
            PAIRS=$(echo "$PAIRS" | grep -v '^$' | sort -u || true)
            PUSHABLE_PAIRS=$(echo "$PUSHABLE_PAIRS" | grep -v '^$' | sort -u || true)
          fi

          # ── Build JSON matrix with latest + pushable flags ─────
          if [[ -z "$PAIRS" ]]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            INCLUDES="[]"
            for pair in $PAIRS; do
              TOOL="${pair%%/*}"
              VERSION="${pair#*/}"
              LATEST=$(latest_version "$TOOL")
              if echo "$PUSHABLE_PAIRS" | grep -qx "$pair"; then
                PUSHABLE=true
              else
                PUSHABLE=false
              fi
              if [[ "$VERSION" == "$LATEST" ]]; then
                INCLUDES=$(echo "$INCLUDES" | \
                  jq --arg t "$TOOL" --arg v "$VERSION" --argjson p "$PUSHABLE" \
                  '. + [{"tool": $t, "version": $v, "latest": true, "pushable": $p}]')
              else
                INCLUDES=$(echo "$INCLUDES" | \
                  jq --arg t "$TOOL" --arg v "$VERSION" --argjson p "$PUSHABLE" \
                  '. + [{"tool": $t, "version": $v, "pushable": $p}]')
              fi
            done
            MATRIX=$(echo "$INCLUDES" | jq -c '{include: .}')
            echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  # ── Build, test & push only the changed images ──────────────
  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image locally
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.tool }}
          build-args: |
            TOOL_VERSION=${{ matrix.version }}
          load: true
          tags: test/${{ matrix.tool }}:${{ matrix.version }}
          cache-from: type=gha,scope=${{ matrix.tool }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tool }}

      - name: Run functional tests
        run: |
          chmod +x tests/${{ matrix.tool }}/test.sh
          tests/${{ matrix.tool }}/test.sh \
            "test/${{ matrix.tool }}:${{ matrix.version }}" \
            "${{ matrix.version }}"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.pushable == true
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.pushable == true
        id: tags
        run: |
          IMAGE=$(echo "${{ env.IMAGE_PREFIX }}/${{ matrix.tool }}" | tr '[:upper:]' '[:lower:]')
          VERSION="${{ matrix.version }}"
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION%.*}"

          # Every build gets the exact version tag
          TAGS="${IMAGE}:${VERSION}"

          # The entry marked latest also gets :major, :minor, and :latest
          if [[ "${{ matrix.latest }}" == "true" ]]; then
            TAGS="${TAGS},${IMAGE}:${MAJOR},${IMAGE}:${MINOR},${IMAGE}:latest"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.pushable == true
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.tool }}
          build-args: |
            TOOL_VERSION=${{ matrix.version }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Container image for ${{ matrix.tool }} ${{ matrix.version }}
            org.opencontainers.image.version=${{ matrix.version }}
          cache-from: type=gha,scope=${{ matrix.tool }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tool }}