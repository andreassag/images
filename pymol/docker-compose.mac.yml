services:
  pymol:
    image: ghcr.io/andreassag/pymol:latest
    build:
      context: .
      args:
        TOOL_VERSION: 3.0.0
    container_name: pymol
    environment:
      - DISPLAY=host.docker.internal:0
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - .:/workspace
      - ./license.lic:/home/pymol/.pymol/license.lic:ro
    stdin_open: true
    tty: true
